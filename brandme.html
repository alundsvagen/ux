<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Mixer — pull the levers & find your flavor</title>
<link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/helios" rel="stylesheet">
<style>
  :root{ --bg:#f6f6f6; --ink:#0b0b0b; --muted:#9aa1a6; --card:#fff; --ring:#111; }
  *{box-sizing:border-box} html,body{height:100%}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Garet',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }

  /* Header (sticky) */
  header{ position:sticky; top:0; z-index:20; backdrop-filter:saturate(120%) blur(6px); background:rgba(246,246,246,.82); border-bottom:1px solid rgba(0,0,0,.06); }
  .header-inner{ max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:clamp(10px,2vw,20px); font-family:'Helios',sans-serif; }
  .brand{ display:flex; flex-direction:column; text-transform:uppercase; letter-spacing:.06em; font-weight:600; font-size:clamp(11px,1.1vw,14px); line-height:1.1 }
  .brand a{ color:var(--ink); text-decoration:underline; text-underline-offset:2px }
  .btn-ghost{ text-decoration:none; color:var(--ink); border:2px solid var(--ink); border-radius:8px; padding:.45rem .9rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:clamp(11px,1.1vw,13px); display:inline-block }

  /* Hero */
  main{ position:relative; overflow:hidden }
  .glow{ position:absolute; top:54svh; left:50%; width:min(120vmin,900px); aspect-ratio:1/1; border-radius:50%;
         background:radial-gradient(circle,rgba(170,255,210,.45), rgba(170,255,210,.18) 45%, rgba(170,255,210,0) 70%);
         filter:blur(8px); transform:translate(-50%,-50%); z-index:0; animation:floatGlow 28s ease-in-out infinite alternate; }
  @keyframes floatGlow{ 0%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.03)} 100%{transform:translate(-50%,-50%) scale(1)} }
  .hero{ position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:clamp(20px,6vw,56px) clamp(14px,4vw,24px); text-align:center; display:grid; gap:clamp(14px,2.2vw,24px) }
  .kicker{ font-family:'Helios',sans-serif; letter-spacing:.07em; text-transform:uppercase; font-weight:500; font-size:clamp(14px,1.8vw,22px) }
  h1{ margin:0; font-weight:900; line-height:.92; font-size:clamp(36px,8vw,96px) }
  .sub{ max-width:880px; margin:0 auto; color:#333; font-size:clamp(14px,1.4vw,18px); opacity:.9 }
  .hero-cta{ margin-top:4px }
  .hero-cta .btn-ghost{ border-radius:10px }

  /* Lever Group */
  .lever-group{ margin-top:clamp(12px,2.5vw,20px); background:var(--card); border:1.5px solid var(--ring); border-radius:24px; box-shadow:0 20px 44px rgba(0,0,0,.12); padding:clamp(12px,2vw,16px); }
  .lever-row{ display:grid; grid-template-columns:repeat(4,minmax(220px,1fr)); gap:clamp(10px,2vw,16px); }
  .lever{ background:#fff; border:1.5px solid var(--ring); border-radius:18px; display:grid; grid-template-rows:auto 1fr; padding:14px; position:relative; }
  .lever h3{ margin:0 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-family:'Helios',sans-serif }

  /* Track + slider (centered) */
  .slider-wrap{ position:relative; display:grid; place-items:center; height:280px }
  .track{ position:absolute; width:6px; height:88%; border-radius:999px; background:#eee; border:1.5px solid var(--ring); box-shadow:inset 0 1px 0 #fff; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:260px; height:36px; background:transparent; transform:rotate(-90deg); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:#111; border:2px solid #111; margin-top:-8.5px; box-shadow:0 2px 0 rgba(0,0,0,.06) inset; }
  input[type=range]::-webkit-slider-runnable-track{ background:transparent }
  input[type=range]::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; background:#111; border:2px solid #111 }
  input[type=range]::-moz-range-track{ background:transparent }

  /* Actions & Result stage */
  .actions{ display:flex; gap:12px; justify-content:center; margin-top:clamp(10px,2vw,16px); flex-wrap:wrap }
  .btn{ border:2px solid var(--ring); background:#fff; color:#111; border-radius:999px; padding:.85rem 1.2rem; font-weight:800; cursor:pointer }
  .btn.primary{ background:#111; color:#fff }
  .result{ display:grid; gap:10px; justify-items:center; text-align:center; padding-top:8px }
  .swatch{ position:relative; width:min(72vmin,520px); aspect-ratio:16/9; border-radius:18px; border:1.5px solid var(--ring);
           box-shadow:0 12px 36px rgba(0,0,0,.12), inset 0 1px 0 #fff; background:#fff; }
  .swatch-label{ position:absolute; inset:0; display:grid; place-items:center; font-weight:900; font-size:clamp(18px,3.4vw,34px); text-transform:none; }

  .tag{ display:inline-block; padding:.32rem .6rem; border:1.5px solid var(--ring); border-radius:999px; background:#fff; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-family:'Helios',sans-serif; font-weight:700 }
  .matches{ display:none } /* hide the little badges */

  /* Explosion bits (monochrome) */
  @keyframes uishake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-6px,4px) rotate(-.4deg)}
    40%{transform:translate(7px,-3px) rotate(.3deg)}
    60%{transform:translate(-4px,6px) rotate(-.2deg)}
    80%{transform:translate(3px,-5px) rotate(.2deg)}
  }
  .shake-hard{ animation:uishake 450ms cubic-bezier(.36,.07,.19,.97) }
  .explosion-flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:2147483600 }
  .shockwave{ position:fixed; width:8px; height:8px; left:0; top:0; border:3px solid rgba(255,255,255,.9); border-radius:50%; transform:translate(-50%,-50%) scale(1); opacity:.9; pointer-events:none; z-index:2147483600 }
  .shard,.smoke{ position:fixed; pointer-events:none; z-index:2147483600; will-change:transform,opacity }
  .shard{ width:6px; height:14px; border-radius:2px; background:currentColor; box-shadow:0 0 8px rgba(0,0,0,.15) }
  .smoke{ width:10px; height:10px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0)); filter:blur(1px); opacity:.7 }

  /* Responsive */
  @media (max-width: 900px){
    .lever-row{ grid-template-columns:repeat(2,minmax(0,1fr)) }
    .slider-wrap{ height:260px }
  }
  @media (max-width: 620px){
    h1{ font-size:clamp(34px,11vw,56px); line-height:1 }
    .lever-row{ grid-template-columns:1fr }
    .slider-wrap{ height:220px }
    input[type=range]{ width:220px; height:34px }
    input[type=range]::-webkit-slider-thumb{ width:32px; height:32px; margin-top:-11px }
    input[type=range]::-moz-range-thumb{ width:32px; height:32px }
    .actions .btn{ flex:1 1 45% }
    .actions .btn.primary{ min-width:48% }
    .swatch{ width:92vw }
  }
  @media (max-width: 380px){ .actions{gap:8px} .actions .btn{flex-basis:100%} }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <a href="#">TAKE AWAY STUDIO</a>
      <small><a href="#">STOCKHOLM</a></small>
    </div>
    <a class="btn-ghost" href="#">Contact</a>
  </div>
</header>

<main>
  <div class="glow" aria-hidden="true"></div>
  <section class="hero">
    <div class="kicker">Brand Me</div>
    <h1>Pull the levers & find your<br><span class="tight">flavor</span></h1>
    <p class="sub">Four levers. One vibe. Mix a profile and calculate your direction.</p>
    <div class="hero-cta">
      <a class="btn-ghost" href="https://google.com" target="_blank" rel="noopener">See Branding Work</a>
    </div>

    <!-- Grouped board -->
    <div class="lever-group">
      <div class="lever-row" role="group" aria-label="Brand levers">
        <div class="lever">
          <h3>Affordable → Expensive</h3>
          <div class="slider-wrap">
            <div class="track"></div>
            <input id="afford" type="range" min="0" max="100" value="40" aria-label="Affordable to Expensive">
          </div>
        </div>
        <div class="lever">
          <h3>Swedish → International</h3>
          <div class="slider-wrap">
            <div class="track"></div>
            <input id="swedint" type="range" min="0" max="100" value="50" aria-label="Swedish to International">
          </div>
        </div>
        <div class="lever">
          <h3>Fintech 0 → Fintech 100</h3>
          <div class="slider-wrap">
            <div class="track"></div>
            <input id="fintech" type="range" min="0" max="100" value="60" aria-label="Fintech scale">
          </div>
        </div>
        <div class="lever">
          <h3>Ready-made → Personal</h3>
          <div class="slider-wrap">
            <div class="track"></div>
            <input id="personal" type="range" min="0" max="100" value="55" aria-label="Ready-made to Personal">
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="calc" class="btn primary">Calculate</button>
      <button id="reset" class="btn">Reset</button>
    </div>

    <!-- Result stage -->
    <div class="result" aria-live="polite">
      <span id="tag" class="tag">Awaiting mix…</span>
      <div id="swatch" class="swatch"><div id="swatchLabel" class="swatch-label"></div></div>
      <p id="desc" class="sub" style="margin:0; max-width:720px"></p>
      <div id="matches" class="matches"></div>
    </div>
  </section>
</main>

<script>
/* ===== Explosion interaction ===== */
function dramaticExplosion({ x, y }) {
  const flash = document.createElement('div');
  flash.className = 'explosion-flash';
  document.body.appendChild(flash);
  flash.animate([{opacity:0},{opacity:.55, offset:.2},{opacity:0}], {duration:380, easing:'ease-out'})
       .onfinish = () => flash.remove();

  const ring = document.createElement('div');
  ring.className = 'shockwave';
  ring.style.left = `${x}px`; ring.style.top = `${y}px`;
  document.body.appendChild(ring);
  ring.animate(
    [{ transform:'translate(-50%,-50%) scale(1)', opacity:.9 },
     { transform:'translate(-50%,-50%) scale(28)', opacity:0 }],
    { duration: 620, easing: 'cubic-bezier(.15,.75,.2,1)', fill: 'forwards' }
  ).onfinish = () => ring.remove();

  document.body.classList.add('shake-hard');
  setTimeout(() => document.body.classList.remove('shake-hard'), 460);

  const COLORS = ['#111','#333','#111','#333'];
  for (let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className = 'shard';
    el.style.color = COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.left = `${x-3}px`; el.style.top = `${y-7}px`;
    document.body.appendChild(el);

    const ang = Math.random()*Math.PI*2;
    const speed = 260 + Math.random()*360;
    const tx = Math.cos(ang)*speed;
    const ty = Math.sin(ang)*speed + 120;
    const rot = (Math.random()*720 - 360);
    const scale = 0.9 + Math.random()*0.6;

    el.animate(
      [{ transform:`translate(0,0) rotate(0) scale(${scale})`, opacity:1 },
       { transform:`translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale*0.9})`, opacity:0 }],
      { duration: 900 + Math.random()*500, easing:'cubic-bezier(.1,.7,0,1)', fill:'forwards' }
    ).onfinish = () => el.remove();
  }

  for (let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className = 'smoke';
    s.style.left = `${x-5}px`; s.style.top = `${y-5}px`;
    document.body.appendChild(s);
    const dx = (Math.random()*2-1)*80, dy = (Math.random()*2-1)*60 - 40;
    s.animate(
      [{ transform:'translate(0,0) scale(1)', opacity:.6 },
       { transform:`translate(${dx}px, ${dy}px) scale(3.2)`, opacity:0 }],
      { duration: 900 + Math.random()*400, easing:'ease-out', fill:'forwards' }
    ).onfinish = () => s.remove();
  }
}
</script>

<script>
(() => {
  /* ===== Full brand dataset (all 17) ===== */
  const BRANDS = [
    {name:'oatly',          price:'Affordable', market:'International', fintech:0,   personal:'Ready-made'},
    {name:'comviq',         price:'Affordable', market:'Swedish',       fintech:0,   personal:'Ready-made'},
    {name:'qliro',          price:'Expensive',  market:'Swedish',       fintech:80,  personal:'Ready-made'},
    {name:'tink',           price:'Affordable', market:'Swedish',       fintech:90,  personal:'Ready-made'},
    {name:'mynt',           price:'Expensive',  market:'Swedish',       fintech:50,  personal:'Ready-made'},
    {name:'stripe',         price:'Affordable', market:'International', fintech:100, personal:'Ready-made'},
    {name:'björn lunden',   price:'Affordable', market:'Swedish',       fintech:30,  personal:'Ready-made'},
    {name:'kulturhuset',    price:'Affordable', market:'International', fintech:0,   personal:'Personal'},
    {name:'NK',             price:'Expensive',  market:'Swedish',       fintech:0,   personal:'Ready-made'},
    {name:'svenskt tenn',   price:'Expensive',  market:'Swedish',       fintech:0,   personal:'Ready-made'},
    {name:'E type',         price:'Affordable', market:'Swedish',       fintech:0,   personal:'Personal'},
    {name:'Press byrån',    price:'Affordable', market:'Swedish',       fintech:0,   personal:'Ready-made'},
    {name:'Burger King',    price:'Affordable', market:'International', fintech:0,   personal:'Ready-made'},
    {name:'Vällingby',      price:'Affordable', market:'International', fintech:0,   personal:'Ready-made'},
    {name:'Saab',           price:'Expensive',  market:'Swedish',       fintech:0,   personal:'Ready-made'},
    {name:'711',            price:'Affordable', market:'International', fintech:0,   personal:'Ready-made'},
    {name:'Clas Ohlson',    price:'Affordable', market:'Swedish',       fintech:0,   personal:'Ready-made'}
  ];

  const inputs=[...document.querySelectorAll('input[type=range]')];
  const calc=document.getElementById('calc');
  const reset=document.getElementById('reset');
  const swatch=document.getElementById('swatch');
  const swatchLabel=document.getElementById('swatchLabel');
  const tag=document.getElementById('tag');
  const desc=document.getElementById('desc');

  /* Flavor logic (stage stays white) */
  function vals(){return{
    price:+afford.value, market:+swedint.value, fintech:+fintech.value, personal:+personal.value
  };}

  const FLAVORS=[
    {id:'Nordic Frugal', match:v=>v.price<35&&v.market<45, copy:'Affordable and local-first. Quiet palette and functional clarity.'},
    {id:'Global Premium',match:v=>v.price>70&&v.market>60, copy:'International presence with premium cues and editorial energy.'},
    {id:'Playful Fintech',match:v=>v.fintech>65&&v.personal>50, copy:'Bold product storytelling with friendly motion and crisp UI tints.'},
    {id:'Personal Craft',match:v=>v.personal>70&&v.price<60, copy:'Human touches, warmer tones, and bespoke details across touchpoints.'},
    {id:'Utility Fin',   match:v=>v.fintech>50&&v.personal<40, copy:'High-contrast, decisive spacing, and product-first clarity.'}
  ];
  const pick = v => FLAVORS.find(f=>f.match(v)) || FLAVORS[0];

  function quantize(v){
    return {
      price: v.price < 50 ? 'Affordable' : 'Expensive',
      market: v.market < 50 ? 'Swedish' : 'International',
      fintech: v.fintech,
      personal: v.personal < 50 ? 'Ready-made' : 'Personal'
    };
  }
  function scoreBrand(target, brand){
    let s = 0;
    if (brand.price !== target.price)   s += 40;
    if (brand.market !== target.market) s += 40;
    if (brand.personal !== target.personal) s += 30;
    s += Math.abs((brand.fintech||0) - target.fintech) * 0.5;
    return s;
  }
  function bestMatches(v, k=3){
    const t = quantize(v);
    return BRANDS
      .map(b => ({...b, _score: scoreBrand({...t, fintech:v.fintech}, b)}))
      .sort((a,b)=>a._score-b._score)
      .slice(0,k);
  }

  /* Calculate: explosion + choose one random brand from the best matches */
  calc.addEventListener('click', (e)=>{
    // Explosion where button is clicked
    const pt = { x: e.clientX || (e.target.getBoundingClientRect().left + e.target.offsetWidth/2),
                 y: e.clientY || (e.target.getBoundingClientRect().top  + e.target.offsetHeight/2) };
    dramaticExplosion(pt);

    const v=vals(), f=pick(v);
    tag.textContent = f.id;
    desc.textContent = f.copy;

    const top = bestMatches(v,3);
    const chosen = top.length ? top[Math.floor(Math.random()*top.length)].name : '';
    swatchLabel.textContent = chosen;

    // tiny pop
    swatch.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
  });

  reset.addEventListener('click',()=>{
    afford.value=40; swedint.value=50; fintech.value=60; personal.value=55;
    tag.textContent='Awaiting mix…'; desc.textContent='';
    swatchLabel.textContent='';
  });

  // Keep stage white while dragging
  inputs.forEach(i=>i.addEventListener('input',()=>{ /* no-op */ }));
})();
</script>
</body>
</html>
